name: Build and Test

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore ClaudeBox.sln
    
    - name: Build
      run: dotnet build ClaudeBox.sln --no-restore --configuration Release
    
    - name: Test
      run: dotnet test ClaudeBox.sln --no-build --configuration Release --verbosity normal
    
    - name: Publish
      run: dotnet publish src/ClaudeBox/ClaudeBox/ClaudeBox.csproj --configuration Release --output ./publish
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClaudeBox-Windows
        path: ./publish/
